name: rider-infra

services:
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_USER: rider
      POSTGRES_PASSWORD: rider
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rider -d app"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    labels:
      - traefik.enable=false
    networks:
      - dev-leadmarket-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    labels:
      - traefik.enable=false
    networks:
      - dev-leadmarket-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: rider
      CLICKHOUSE_USER: rider
      CLICKHOUSE_PASSWORD: rider
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      # 8123 and 9000 on the host belong to an unrelated clickhouse_demo.
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    labels:
      - traefik.enable=false
    networks:
      - dev-leadmarket-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped
    labels:
      - traefik.enable=false
    networks:
      - dev-leadmarket-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    labels:
      - traefik.enable=false
    networks:
      - dev-leadmarket-network

  kafka-ui:
    image: docker.redpanda.com/redpandadata/console:v2.7.1
    depends_on:
      - kafka
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:29092"]
          schemaRegistry:
            enabled: false
    ports:
      - "8088:8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-leadmarket-network
      - traefik.http.routers.rider-kafka.rule=Host(`kafka.rider.io`)
      - traefik.http.routers.rider-kafka.entrypoints=https
      - traefik.http.routers.rider-kafka.tls=true
      - traefik.http.services.rider-kafka.loadbalancer.server.port=8080
    restart: unless-stopped
    networks:
      - dev-leadmarket-network

volumes:
  postgres:
  redis:
  clickhouse:

networks:
  dev-leadmarket-network:
    name: dev-leadmarket-network
    external: true
