services:
  auth:
    image: {{ INSTALL_IMAGE1 }}  
    build:
      dockerfile: ./Dockerfile
      context: .
      args:
        - NEXT_PUBLIC_ORY_SDK_URL=https://id.leadmarket.io
    restart: unless-stopped
#    command: ['npm', 'start']
#    volumes:
#      - ./:/app/
    ports:
      - "127.0.0.1:{{ INSTALL_DEPLOY_PORT }}:3000"
    env_file:
      - path: env_file
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 256M


